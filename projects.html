<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Start a Project | Shreya</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: linear-gradient(135deg, #0e141b, #141f2b);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.form-container {
  background: #121a23;
  padding: 35px;
  border-radius: 12px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

.form-container h2 {
  margin-bottom: 10px;
  font-weight: 600;
}

.form-container p {
  margin-bottom: 25px;
  color: #bbb;
  font-size: 14px;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border-radius: 6px;
  border: none;
  background: #1c2530;
  color: white;
  font-size: 14px;
}

input::placeholder, textarea::placeholder {
  color: #888;
}

textarea {
  resize: none;
  height: 110px;
}

button {
  padding: 12px;
  width: 100%;
  background: linear-gradient(90deg, #e74aff, #9b59ff);
  color: white;
  border: none;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s ease;
}

button:hover {
  transform: translateY(-2px);
  opacity: 0.9;
}

.success {
  margin-top: 15px;
  color: #4caf50;
  display: none;
  font-size: 14px;
}

@media(max-width: 480px) {
  .form-container {
    padding: 25px;
  }
}
</style>
</head>

<body>

<div class="form-container">
  <h2>Start a Project</h2>
  <p>Tell me about your idea and I’ll get back to you.</p>

  <form id="projectForm">
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
    <input type="tel" placeholder="Mobile Number" pattern="[0-9]{10}" required>
    <textarea placeholder="Project Description" required></textarea>
    <button type="submit">Send Request</button>
    <div class="success" id="successMsg">Message sent! I'll contact you soon.</div>
  </form>
</div>

<script>
document.getElementById("projectForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const name = this.querySelector('input[type="text"]').value;
  const email = this.querySelector('input[type="email"]').value;
  const phone = this.querySelector('input[type="tel"]').value;
  const message = this.querySelector("textarea").value;

  try {
    const res = await fetch("https://portfolio-backend-1-4fro.onrender.com/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, phone, message })
    });

    const data = await res.json();

    if (data.success) {
      document.getElementById("successMsg").style.display = "block";
      this.reset();
    } else {
      alert("Server error: " + data.error);
    }

  } catch (err) {
    console.error(err);
    alert("Network error.");
  }
});
</script>

</body>
</html>
